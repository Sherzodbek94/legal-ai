# =============================================================================
# Secrets — TEMPLATE ONLY. DELIBERATELY NOT APPLIED BY CI.
#
# This file is excluded from the deploy workflow on purpose. Applying it would
# overwrite every real secret in the cluster with an empty string, and the
# symptom — every pod failing to start — names none of the causes.
#
# DO NOT COMMIT REAL VALUES. Kubernetes Secrets are base64-encoded, not
# encrypted: anyone who can read the resource can read the plaintext, and anyone
# who can read the git history can read whatever was ever committed to it.
#
# Create the Secret out of band, once, with one of:
#
#   * Sealed Secrets — encrypted with the cluster's public key. The sealed form
#     IS safe to commit, which makes it the best fit for a GitOps flow:
#         kubeseal -o yaml < secret.yaml > sealed-secret.yaml
#
#   * External Secrets Operator — syncs from Vault / AWS Secrets Manager /
#     GCP Secret Manager. The right answer when a secrets manager already exists.
#
#   * Directly, for a small deployment:
#         kubectl -n legaltech create secret generic legaltech-secrets \
#           --from-env-file=production.env
#
# The Deployment references this Secret by name, so it must exist before the
# first rollout — a missing Secret leaves pods in CreateContainerConfigError.
#
# Generate the application secrets with:
#     openssl rand -base64 48
# JWT_ACCESS_SECRET and DOCUMENT_VERIFICATION_SECRET both enforce a minimum
# length in code and refuse to start if set to something short.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: legaltech-secrets
  namespace: legaltech
type: Opaque
stringData:
  # --- Data stores -----------------------------------------------------------
  DATABASE_URL: ""
  REDIS_URL: ""

  # --- Application secrets ---------------------------------------------------
  JWT_ACCESS_SECRET: ""
  DOCUMENT_VERIFICATION_SECRET: ""

  # --- AI providers ----------------------------------------------------------
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

  # --- Object storage --------------------------------------------------------
  # The bucket MUST be private: seals and signatures are forgery-grade material
  # and are served only through short-lived presigned URLs.
  S3_BUCKET_NAME: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: ""
  S3_ENDPOINT: ""

  # --- Payment gateways ------------------------------------------------------
  CLICK_SERVICE_ID: ""
  CLICK_MERCHANT_ID: ""
  CLICK_SECRET_KEY: ""
  PAYME_MERCHANT_ID: ""
  PAYME_MERCHANT_KEY: ""
  UZUM_MERCHANT_ID: ""
  UZUM_SECRET_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # --- Notifications ---------------------------------------------------------
  # ESKIZ_FROM defaults to Eskiz's shared test sender, which only delivers to
  # numbers registered on the account. Set a real sender id before launch.
  ESKIZ_EMAIL: ""
  ESKIZ_PASSWORD: ""
  ESKIZ_FROM: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_USERNAME: ""
  RESEND_API_KEY: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""

  # --- OneID (id.egov.uz) ----------------------------------------------------
  ONEID_CLIENT_ID: ""
  ONEID_CLIENT_SECRET: ""
  ONEID_REDIRECT_URI: ""
