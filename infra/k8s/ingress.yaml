apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legaltech-ingress
  namespace: legaltech
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # Gateway-level rate limiting; complements the in-app @nestjs/throttler guard.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  tls:
    - hosts:
        - app.legaltech.example.com
      secretName: legaltech-tls
  rules:
    - host: app.legaltech.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: legaltech-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legaltech-web
                port:
                  number: 3000
