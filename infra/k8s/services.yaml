# =============================================================================
# Services
#
# Ports are named so the Ingress can reference them by name. A numeric reference
# breaks silently if a container port is ever changed; a name does not.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: legaltech-api
  namespace: legaltech
  labels:
    app.kubernetes.io/name: legaltech-api
    app.kubernetes.io/part-of: legaltech
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legaltech-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  # Only Ready pods receive traffic. This is the default and is stated explicitly
  # because setting it to true — which some guides suggest for faster startup —
  # would route requests to pods that have not finished connecting to Postgres.
  publishNotReadyAddresses: false
---
apiVersion: v1
kind: Service
metadata:
  name: legaltech-web
  namespace: legaltech
  labels:
    app.kubernetes.io/name: legaltech-web
    app.kubernetes.io/part-of: legaltech
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legaltech-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
