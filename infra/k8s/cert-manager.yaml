# =============================================================================
# cert-manager ClusterIssuers
#
# PREREQUISITE: cert-manager itself must already be installed in the cluster.
# These are issuers, not the controller:
#
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
#
# Two issuers, and using the staging one first is not optional advice. Let's
# Encrypt's production endpoint allows 5 duplicate-certificate requests per week
# per identifier — a misconfigured Ingress that fails validation five times locks
# the domain out for the rest of the week, and there is no way to reset it.
# Staging has effectively no limit and issues an untrusted certificate, which is
# exactly what is wanted while proving the HTTP-01 challenge path works.
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Expiry warnings go here. Worth a real address: it is the only notice given
    # if renewal starts failing.
    email: ops@legaltech.example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@legaltech.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01: cert-manager creates a temporary Ingress path for the challenge,
      # so the domain must already resolve to this cluster's load balancer before
      # the first issuance can succeed.
      #
      # Switch to DNS-01 if wildcard certificates are ever needed — HTTP-01
      # cannot issue them, and that limitation is usually discovered at the point
      # someone adds a per-tenant subdomain.
      - http01:
          ingress:
            ingressClassName: nginx
---
# =============================================================================
# Explicit Certificate.
#
# The Ingress annotation alone is enough for cert-manager to provision a
# certificate. This declares it explicitly for one reason: it makes the desired
# state visible in the manifests, so a reviewer can see which SANs are covered
# and when renewal happens, rather than inferring it from an annotation.
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: legaltech-tls
  namespace: legaltech
spec:
  secretName: legaltech-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: app.legaltech.example.com
  dnsNames:
    - app.legaltech.example.com
  # Renew 30 days before the 90-day certificate expires. cert-manager's default
  # is two-thirds of the lifetime; 30 days leaves a wide window to notice and fix
  # a failing renewal before anything is actually served an expired certificate.
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotates the key on renewal rather than reusing it. Slightly more work for
    # the ACME server, and it means a key compromise is bounded by the renewal
    # interval instead of lasting for the life of the domain.
    rotationPolicy: Always
